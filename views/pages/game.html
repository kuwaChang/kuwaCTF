<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF RPGモード</title>
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>CTF RPGモード</h1>
      <p>CTFで稼いだ得点を使ってキャラを強化し、敵を倒そう。</p>
      <div class="actions">
        <button id="syncScoreBtn">CTF解答を同期（GP反映）</button>
        <a class="link-btn" href="/">トップへ戻る</a>
      </div>
      <p id="syncMessage" class="message"></p>
    </header>

    <section class="panel">
      <h2>プレイヤー情報</h2>
      <div id="playerSummary" class="player-summary"></div>
    </section>

    <section class="panel">
      <h2>レベル＆成長</h2>
      <div id="growthInfo" class="growth-info"></div>
    </section>

    <section class="panel">
      <h2>装備ショップ</h2>
      <div id="shopList" class="shop-list"></div>
    </section>

    <section class="panel">
      <h2>ステージ選択</h2>
      <p>全ステージ解放済み。クリア済みステージも何度でも周回してレベル上げできます。</p>
      <div id="stageSelection" class="stage-grid"></div>
    </section>

  </main>

  <script type="module" src="../js/game.js"></script>
</body>
</html>
